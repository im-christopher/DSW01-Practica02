name: Primer Workflow CI

on:
	push:
		branches:
			- main
			- master
			- develop
	pull_request:
		branches:
			- main
			- master
			- develop

jobs:
	backend:
		name: Backend - Build y Tests
		runs-on: ubuntu-latest

		steps:
			- name: Checkout
				uses: actions/checkout@v4

			- name: Configurar Java 17
				uses: actions/setup-java@v4
				with:
					distribution: temurin
					java-version: '17'
					cache: maven

			- name: Ejecutar tests backend
				run: mvn -B clean verify

	frontend:
		name: Frontend - Build Angular
		runs-on: ubuntu-latest
		defaults:
			run:
				working-directory: frontend

		steps:
			- name: Checkout
				uses: actions/checkout@v4

			- name: Configurar Node.js
				uses: actions/setup-node@v4
				with:
					node-version: '22'
					cache: npm
					cache-dependency-path: frontend/package-lock.json

			- name: Instalar dependencias
				run: npm ci

			- name: Build frontend
				run: npm run build
