name: 02-Sonar

on:
  push:
    branches:
      - main
      - master
      - develop
  workflow_run:
    workflows:
      - 01-CI
    types:
      - completed
  pull_request:
    branches:
      - main
      - master
      - develop

jobs:
  sonar:
    name: SonarQube - Backend Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Validar configuracion Sonar
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "❌ Falta el secret SONAR_TOKEN en GitHub Settings > Secrets"
            exit 1
          fi

          if [ -z "$SONAR_HOST_URL" ]; then
            echo "❌ Falta el secret SONAR_HOST_URL en GitHub Settings > Secrets"
            exit 1
          fi

          if [ -z "$SONAR_ORGANIZATION" ]; then
            echo "❌ Falta la variable SONAR_ORGANIZATION en GitHub Settings > Variables"
            exit 1
          fi

      - name: Build + Sonar
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
        run: |
          PROJECT_KEY="${SONAR_PROJECT_KEY:-dsw01-practica02}"

          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey="$PROJECT_KEY" \
            -Dsonar.organization="$SONAR_ORGANIZATION" \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.token="$SONAR_TOKEN"
