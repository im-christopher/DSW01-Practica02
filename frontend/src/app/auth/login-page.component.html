<main class="login-layout" role="main" aria-labelledby="login-title">
  <a class="skip-link" href="#login-form">Saltar al formulario</a>

  <section class="login-card">
    <p class="eyebrow">Acceso administrativo</p>
    <h1 id="login-title">Iniciar sesion</h1>
    <p class="subtitle">Usa tus credenciales para gestionar empleados.</p>

    <div class="feedback success" *ngIf="announcer.status()" aria-live="polite">{{ announcer.status() }}</div>
    <div class="feedback error" *ngIf="announcer.error()" aria-live="assertive">{{ announcer.error() }}</div>

    <form id="login-form" [formGroup]="loginForm" (ngSubmit)="submit()" novalidate>
      <label for="username">Usuario</label>
      <input id="username" type="text" formControlName="username" autocomplete="username" />

      <label for="password">Contrasena</label>
      <input id="password" type="password" formControlName="password" autocomplete="current-password" />

      <button type="submit" class="btn" [disabled]="loading">
        {{ loading ? 'Validando...' : 'Entrar' }}
      </button>
    </form>
  </section>
</main>
